<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Local Pick</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--cream:#EFF3E6;--card:#fff;--green:#3F5D37;--green-dark:#20281C;--ink:#262B20;--muted:#6E7460;--border:#DCE2CC;--shadow:0 10px 30px rgba(32,40,28,0.10);}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--cream);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;line-height:1.55;}
  header{border-bottom:1px solid var(--border);}
  .nav{max-width:1080px;margin:0 auto;padding:14px 24px;}
  .brand{display:inline-flex;align-items:center;gap:10px;font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:var(--green-dark);text-decoration:none;}
  .brand img{width:34px;height:34px;border-radius:9px;}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;gap:14px;}
  .big{font-family:'Sora',sans-serif;font-weight:800;font-size:88px;line-height:1;color:var(--green);margin:0;}
  h1{font-family:'Sora',sans-serif;font-weight:800;font-size:32px;line-height:1.15;color:var(--green-dark);margin:0;max-width:560px;}
  p{margin:0;color:var(--muted);font-size:17px;max-width:480px;}
  .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px;}
  .btn{display:inline-flex;align-items:center;padding:13px 26px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:hover{background:var(--green-dark);}
  .btn-ghost{background:var(--card);color:var(--green-dark);border:1.5px solid var(--border);}
  .btn:focus-visible{outline:3px solid var(--green-dark);outline-offset:3px;}
  footer{padding:24px;text-align:center;font-size:13px;color:var(--muted);}
  footer a{color:var(--green);text-decoration:none;font-weight:500;}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="/"><img src="/assets/logo.png" alt="" width="34" height="34">Local Pick</a></div></header>
<main>
  <p class="big" aria-hidden="true">404</p>
  <h1>Nothing growing here.</h1>
  <p>This page doesn't exist, or it's been picked already. Head back to the homepage to find out what's ripe near you.</p>
  <div class="row">
    <a class="btn btn-primary" href="/">Back to Local Pick</a>
    <a class="btn btn-ghost" href="https://play.google.com/store/apps/details?id=com.localpick.app" target="_blank" rel="noopener">Get it on Google Play</a>
  </div>
</main>
<footer>Questions? <a href="mailto:hello@local-pick.com">hello@local-pick.com</a> &middot; <a href="/privacy">Privacy</a> &middot; <a href="/terms">Terms</a></footer>
</body>
</html>
