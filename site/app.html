<script>
  // The link on posters and QR codes (local-pick.com/app). Sends each phone
  // straight to its store; anything else sees the page below. The Play link
  // carries a referrer so poster installs show up in Play Console.
  (function () {
    var ua = navigator.userAgent || '';
    var play = 'https://play.google.com/store/apps/details?id=com.localpick.app'
      + '&referrer=' + encodeURIComponent('utm_source=poster&utm_medium=qr');
    var isIOS = /iPhone|iPad|iPod/i.test(ua)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (/Android/i.test(ua)) {
      location.replace(play);
    } else if (isIOS) {
      // Not on the App Store yet: the homepage's "email me when it's out" form.
      location.replace('/?utm_source=poster&utm_medium=qr#notify');
    }
  })();
</script>

<style>

  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--cream);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;line-height:1.55;}

  h1{font-family:'Sora',sans-serif;font-weight:800;font-size:34px;line-height:1.15;color:var(--green-dark);margin:0;max-width:560px;}
  p{margin:0;color:var(--muted);font-size:17px;max-width:460px;}
  .row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;margin-top:8px;}
  .play-btn{display:inline-flex;align-items:center;gap:12px;background:#111;color:#fff;text-decoration:none;padding:10px 22px 10px 18px;border-radius:14px;box-shadow:var(--shadow);}
  .play-btn:hover{background:#000;}
  .play-btn span{display:flex;flex-direction:column;text-align:left;font-family:'Sora',sans-serif;font-weight:600;font-size:20px;line-height:1.1;}
  .play-btn small{font-family:'Work Sans',sans-serif;font-weight:500;font-size:10.5px;letter-spacing:.06em;opacity:.85;}
  .ios{display:inline-flex;flex-direction:column;align-items:flex-start;text-align:left;border:1.5px dashed var(--border);border-radius:14px;padding:9px 16px;background:var(--card);color:var(--muted);font-size:13.5px;text-decoration:none;}
  .ios strong{color:var(--ink);font-weight:600;font-size:14px;}
  .ios:hover{border-color:var(--green);}
  a:focus-visible{outline:3px solid var(--green-dark);outline-offset:3px;}
  .home{color:var(--green);font-weight:600;text-decoration:none;margin-top:6px;}
  footer{padding:24px;text-align:center;font-size:13px;color:var(--muted);}
  footer a{color:var(--green);text-decoration:none;font-weight:500;}
</style>
